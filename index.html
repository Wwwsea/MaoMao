	<!-- 首次访问问答弹窗 -->
	<style>
		#who-gate {
			position: fixed; inset: 0; z-index: 2147483647;
			display: flex; align-items: center; justify-content: center;
			background: rgba(255,255,255,0.25);
			-webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
			opacity: 1; transition: opacity .45s ease;
			font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
		}
		#who-gate.hide { opacity: 0; pointer-events: none; }
		#who-gate .who-box {
			width: min(360px, 86vw); padding: 32px 28px 28px;
			background: rgba(255,255,255,0.85); border-radius: 24px;
			box-shadow: 0 20px 60px rgba(0,0,0,0.12);
			text-align: center;
		}
		#who-gate h2 { margin: 0 0 20px; font-size: 22px; font-weight: 600; color: #111; letter-spacing: .02em; }
		#who-gate input {
			width: 100%; box-sizing: border-box; height: 46px; padding: 0 16px;
			border: 1px solid rgba(0,0,0,0.12); border-radius: 72px; outline: none;
			font-size: 16px; text-align: center; background: #F5F7F8; color: #111;
			transition: border-color .2s ease;
		}
		#who-gate input:focus { border-color: rgba(0,0,0,0.35); }
		#who-gate .who-err { height: 18px; margin-top: 10px; font-size: 13px; color: #e5484d; }
		#who-gate .shake { animation: whoShake .4s; }
		@keyframes whoShake {
			20%, 60% { transform: translateX(-8px); }
			40%, 80% { transform: translateX(8px); }
		}
	</style>
	<script>
	(function () {
		var KEY = 'who_gate_passed';
		try { if (localStorage.getItem(KEY) === '1') return; } catch (e) {}

		var gate = document.createElement('div');
		gate.id = 'who-gate';
		gate.innerHTML =
			'<div class="who-box">' +
				'<h2>我是谁</h2>' +
				'<input type="text" placeholder="请输入答案，回车确认" autocomplete="off" />' +
				'<div class="who-err"></div>' +
			'</div>';
		document.body.appendChild(gate);

		var prevOverflow = document.documentElement.style.overflow;
		document.documentElement.style.overflow = 'hidden';

		var input = gate.querySelector('input');
		var err = gate.querySelector('.who-err');
		var box = gate.querySelector('.who-box');
		setTimeout(function () { input.focus(); }, 50);

		input.addEventListener('keydown', function (e) {
			if (e.key !== 'Enter' || e.isComposing) return;
			e.preventDefault();
			if (input.value.trim() === '非余') {
				try { localStorage.setItem(KEY, '1'); } catch (e) {}
				gate.classList.add('hide');
				document.documentElement.style.overflow = prevOverflow;
				setTimeout(function () { gate.remove(); }, 500);
			} else {
				err.textContent = '答案不对，再想想';
				box.classList.remove('shake');
				void box.offsetWidth;
				box.classList.add('shake');
				input.select();
			}
		});
	})();
	</script>
